name: Build, Test, Deploy (Dev)

on:
  push:
    branches:
      - master
      - dev
      - DEVLAB-38
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-dev

env:
  VM_NAME: LSDGDW-AZWEB01
  TOMCAT_SERVICE: Tomcat10
  HTTP_PORT: "8080"
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  STORAGE_ACCOUNT: ${{ vars.DEPLOY_STORAGE_ACCOUNT }}
  CONTAINER: deployments

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build WAR
        run: mvn -B package -DskipTests

      - name: Find WAR file
        id: findwar
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          echo "WAR_FILE=$WAR_FILE" >> $GITHUB_ENV
          echo "WAR_NAME=$(basename $WAR_FILE)" >> $GITHUB_ENV

      - name: Copy WAR file
        run: |
          mkdir -p dist
          cp "$WAR_FILE" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: war
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: war

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy WAR to Tomcat
        shell: bash
        run: |
          WAR_NAME=$(ls *.war | head -n 1)
          APP_NAME="${WAR_NAME%.war}"
          BLOB="${WAR_NAME}-${GITHUB_RUN_ID}"

          echo "Detected WAR: $WAR_NAME"
          echo "App Name: $APP_NAME"

          az storage blob upload --auth-mode login --only-show-errors --overwrite \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$BLOB" \
            --file "$WAR_NAME"

          SAS_URL=$(az storage blob generate-sas --auth-mode login --as-user --https-only --full-uri -o tsv \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$BLOB" \
            --permissions r \
            --expiry "$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%MZ')")

          echo "::add-mask::$SAS_URL"

          az vm run-command invoke \
            -g "$RESOURCE_GROUP" \
            -n "$VM_NAME" \
            --command-id RunPowerShellScript \
            --scripts "
              \$ErrorActionPreference = 'Stop'
              \$ProgressPreference = 'SilentlyContinue'

              try {
                  \$WarUrl = '$SAS_URL'
                  \$WarName = '$WAR_NAME'
                  \$AppName = '$APP_NAME'
                  \$Service = '$TOMCAT_SERVICE'
                  \$Port = $HTTP_PORT

                  \$svc = Get-CimInstance Win32_Service -Filter \"Name='\$Service'\"
                  if (-not \$svc) { throw \"Service '\$Service' not found.\" }

                  \$exe = if (\$svc.PathName -match '^\"([^\"]+)\"') { \$Matches[1] } else { (\$svc.PathName -split '\s+')[0] }
                  \$webapps = Join-Path (Split-Path (Split-Path \$exe)) 'webapps'

                  \$tmp = Join-Path \$env:TEMP \$WarName
                  Invoke-WebRequest -Uri \$WarUrl -OutFile \$tmp -UseBasicParsing

                  Stop-Service \$Service -Force
                  (Get-Service \$Service).WaitForStatus('Stopped', '00:01:30')

                  Remove-Item (Join-Path \$webapps \$AppName) -Recurse -Force -ErrorAction SilentlyContinue
                  Move-Item \$tmp (Join-Path \$webapps \"\$WarName\") -Force

                  Start-Service \$Service
                  (Get-Service \$Service).WaitForStatus('Running', '00:01:30')

                  \$ctx = if (\$AppName -eq 'ROOT') { '' } else { \"\$AppName/\" }

                  for (\$i = 0; \$i -lt 24; \$i++) {
                      try {
                          \$code = [int](Invoke-WebRequest \"http://localhost:\$Port/\$ctx\" -UseBasicParsing -TimeoutSec 10).StatusCode
                      } catch {
                          \$code = if (\$_.Exception.Response) { [int]\$_.Exception.Response.StatusCode } else { 0 }
                      }

                      if (\$code -ge 200 -and \$code -lt 400) { break }
                      Start-Sleep 5
                  }

                  if (\$code -lt 200 -or \$code -ge 400) {
                      throw \"Health check failed (HTTP \$code)\"
                  }

                  'DEPLOY_RESULT=SUCCESS'
              } catch {
                  \"DEPLOY_RESULT=FAILED: \$($_.Exception.Message)\"
                  Start-Service \$Service -ErrorAction SilentlyContinue
                  exit 1
              }
            " \
            --query "value[0].message" -o tsv > vm-output.txt

          az storage blob delete --auth-mode login --only-show-errors \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$BLOB" || true

          cat vm-output.txt

          grep -q "DEPLOY_RESULT=SUCCESS" vm-output.txt
