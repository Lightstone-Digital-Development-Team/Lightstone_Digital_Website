name: Build, Test, Deploy

on:
  push:
    branches:
      - DEVLAB-38

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR file
        run: |
          mvn clean package
          mkdir -p war
          cp target/*.war war/

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war
          path: war/*.war

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war
          path: war

      # ✅ Force OIDC and remove service principal fallback
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          auth-type: OIDC
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        run: az account show

      - name: Deploy WAR to VM
        run: |
          az vm run-command invoke \
            --resource-group DEVLAB \
            --name LSDGDW-AZWEB01 \
            --command-id RunShellScript \
            --scripts "sudo mv /home/azureuser/war/*.war /opt/tomcat/webapps/ROOT.war && sudo systemctl restart tomcat"
