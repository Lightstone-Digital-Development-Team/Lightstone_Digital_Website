name: Build, Test, Deploy

on:
  push:
    branches:
      - DEVLAB-51/basic-setup

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Initial Build
        run: echo "Hello! Welcome to the build"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Test VM Connection
        run: |
          az vm run-command invoke \
            --resource-group DEVLAB \
            --name LSDGDW-AZWEB01 \
            --command-id RunPowerShellScript \
            --scripts "Write-Output 'Connection successful from GitHub Actions!'"

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test
        run: echo "Time for a test"

  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy
        run: echo "Test deploy"
