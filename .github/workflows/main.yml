name: Build, Test, Deploy

on:
  push:
    branches:
      - DEVLAB-51/basic-setup

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Configure WinRM Client for HTTP
        shell: pwsh
        run: |
          winrm quickconfig -q
          winrm set winrm/config/client '@{AllowUnencrypted="true"}'
          winrm set winrm/config/client/auth '@{Basic="true"}'

      - name: Add VM to TrustedHosts
        shell: pwsh
        run: |
          Set-Item WSMan:\localhost\Client\TrustedHosts -Value "57.154.240.187" -Force

      - name: Run PowerShell command on remote Windows Server 2025 VM
        shell: pwsh
        run: |
          $ip = "57.154.240.187"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Invoke-Command -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic -ScriptBlock {
            Write-Output "Hello from GitHub Actions via WinRM over HTTP!"
            hostname
            Get-Date
          }

      - name: Start Tomcat using startup.bat (non-blocking)
        shell: pwsh
        run: |
          $ip = "57.154.240.187"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Invoke-Command -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic -ScriptBlock {
            Write-Output "Starting Tomcat using startup.bat..."
            Start-Process "cmd.exe" -ArgumentList "/c C:\apache-tomcat-10.1.60\bin\startup.bat"
            Write-Output "Tomcat startup command issued successfully."
          }
