name: Build, Test, Deploy

on:
  push:
    branches:
      - master
      - dev
      - DEVLAB-38

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Initial Build
        run: echo "Hello! Welcome to the build"

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test
        run: echo "Time for a test"

  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy
        run: echo "Test deploy"
