name: Build, Test, Deploy

on:
  push:
    branches:
      - DEVLAB-51/basic-setup

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Configure WinRM Client for HTTP
        shell: pwsh
        run: |
          winrm quickconfig -q
          winrm set winrm/config/client '@{AllowUnencrypted="true"}'
          winrm set winrm/config/client/auth '@{Basic="true"}'

      - name: Add VM to TrustedHosts
        shell: pwsh
        run: |
          Set-Item WSMan:\localhost\Client\TrustedHosts -Value "20.83.176.59" -Force

      - name: Run PowerShell command on remote Windows Server 2025 VM
        shell: pwsh
        run: |
          $ip = "20.83.176.59"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Invoke-Command -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic -ScriptBlock {
            Write-Output "Hello from GitHub Actions via WinRM over HTTP!"
            hostname
            Get-Date
          }

      # ⭐ FIXED TOMCAT JOB — now non-blocking and reliable
      - name: Start Tomcat in background (non-blocking fix)
        shell: pwsh
        run: |
          $ip = "20.83.176.59"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Invoke-Command -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic -ScriptBlock {

            $taskName = "StartTomcatDetached"
            $tomcatBin = "C:\apache-tomcat-10.1.60\bin\catalina.bat"

            Write-Output "Creating scheduled task to start Tomcat detached..."

            schtasks /create /tn $taskName /tr "\"$tomcatBin\" start" /sc once /st 00:00 /f

            Write-Output "Running scheduled task..."
            schtasks /run /tn $taskName

            Write-Output "Tomcat start triggered successfully and detached from WinRM session."
          }
