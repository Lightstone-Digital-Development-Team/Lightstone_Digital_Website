name: Build, Test, Deploy

on:
  push:
    branches:
      - DEVLAB-51/basic-setup

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Configure WinRM Client for HTTP
        shell: pwsh
        run: |
          winrm quickconfig -q
          winrm set winrm/config/client '@{AllowUnencrypted="true"}'
          winrm set winrm/config/client/auth '@{Basic="true"}'

      - name: Add VM to TrustedHosts
        shell: pwsh
        run: |
          Set-Item WSMan:\localhost\Client\TrustedHosts -Value "57.154.240.187" -Force

      - name: Build WAR
        shell: pwsh
        run: |
          mvn -B package

      - name: Copy WAR to Tomcat webapps
        shell: pwsh
        run: |
          $ip = "57.154.240.187"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Write-Output "Opening WinRM session..."
          $session = New-PSSession -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic

          Write-Output "Copying WAR file to Tomcat webapps..."
          Copy-Item "./target/yourapp.war" -Destination "C:\apache-tomcat-10.1.60\webapps\" -ToSession $session -Force

          Write-Output "WAR file copied successfully."
          Remove-PSSession $session

      - name: Start Tomcat via Windows Service (non-blocking, reliable)
        shell: pwsh
        run: |
          $ip = "57.154.240.187"
          $username = "azureuser"
          $password = ConvertTo-SecureString "${{ secrets.WINRM_PASSWORD }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($username, $password)

          Invoke-Command -ComputerName $ip -Credential $cred -Port 5985 -Authentication Basic -ScriptBlock {
            Write-Output "Starting Tomcat service..."
            Start-Service Tomcat10
            Write-Output "Tomcat service started successfully."
          }
